services:
  postgres:
    image: postgres:17
    container_name: myapp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: weight-tracker
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: