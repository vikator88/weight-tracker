schema: spec-driven

context: |
    This repository uses the STPR method.

    STPR means Skeleton + Template + Plan + Review.

    OpenSpec is optional workflow support only. It is not the core of the method.

    OpenSpec artifacts must follow:
    - `.stpr/template/STPR_INVARIANTS.md`
    - `.stpr/template/README.md`
    - `.stpr/template/`
    - `AGENTS.md`
    - `.stpr/README.md`

rules:
    proposal:
        - Treat `.stpr/template/` and `.stpr/template/STPR_INVARIANTS.md` as mandatory constraints, not optional references.
        - Use `.stpr/template/README.md` to choose the canonical reference module before describing implementation.
        - Treat the resulting artifact as part of the Plan layer of STPR.
        - Use `AGENTS.md` for project-specific guidance that is not already enforced by the invariants or template.
        - Explicitly call out any conflict between the requested change and the template or invariants.
        - Keep the proposal focused on scope, goals, constraints, and acceptance criteria.
        - Require every capability to declare its canonical template reference explicitly.
        - Require every module with a unique business identifier to declare whether that identifier is mutable or immutable.
    design:
        - Treat the design as a refinement of the Plan layer, not as a second architecture source of truth.
        - Follow the template and invariants instead of restating architecture here.
        - Describe how the change maps to `Api`, `Application`, `Domain`, and `Infrastructure`.
        - State cross-module dependencies explicitly.
        - Preserve the repository pattern and current authorization approach when applicable.
        - If a mutable aggregate allows updating a unique business identifier, describe exact persistence semantics so the update cannot create duplicate records.
        - Do not change helper or test request patterns from the template unless the design documents an environment-specific exception explicitly.
    tasks:
        - Treat tasks as executable Plan work, not as an independent source of architecture decisions.
        - Derive implementation and test work from the template, invariants, and AGENTS guidance rather than duplicating those rules here.
        - Include implementation tasks and test tasks.
        - Break work into small, ordered tasks that can be implemented incrementally.
        - Include a review task for each capability that compares the generated module against its mapped template reference before closing it.
